<body>
  <a href="#main" class="skip">Ir al contenido</a>
  <aside class="sidebar">
    <a class="brand" href="#inicio" aria-label="Ir al inicio">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M22 38C5 31 6 15 10 9c10 2 15 11 12 29Zm0 0c17-7 16-23 12-29-10 2-15 11-12 29ZM22 36V9"/></svg></span>
      <span class="brand-name">Savia</span>
    </a>
    <p class="brand-caption">PRESENCIA PARA EXPRESARTE</p>
    <nav id="navigation" aria-label="Navegación principal"></nav>
    <div class="sidebar-bottom">
      <div class="small-flower" aria-hidden="true">✳</div>
      <p>Tu ritmo.<br>Tu voz.<br>Tu propio camino.</p>

      <span class="demo-badge">DEMO INTERACTIVA</span>

  <div class="app-shell">
    <header class="topbar">
      <span class="mobile-brand brand-name">Savia</span>
      <span class="top-phrase"><span class="presence-dot"></span> Un momento para volver a ti</span>
      <button class="name-explore" data-go="esencia">La esencia de Savia <span aria-hidden="true">✧</span></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer"><span>Meditación y comunicación consciente</span><button class="text-button" data-action="about">Conocer Savia</button><button class="text-button" data-action="privacy">Tu privacidad</button></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal-root" hidden></div>
  <script>'use strict';
const $=s=>document.querySelector(s);
const main=$('#main');
const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',path:'<path d="M6 21v-4c0-4 12-3 12-8V3M3 21h6M15 3h6"/><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/>',leaf:'<path d="M20 3C8 2 2 8 5 16c8 4 15-2 15-13Z"/><path d="M4 21 15 9"/>',book:'<path d="M4 3h13a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2Zm0 14h15"/><path d="M8 7h7M8 10h5"/>',spark:'<path d="m12 2 2.6 6.9L22 12l-7.4 3.1L12 22l-2.6-6.9L2 12l7.4-3.1Z"/>',arrow:'<path d="M4 12h15m-5-5 5 5-5 5"/>',play:'<path d="m8 5 11 7-11 7Z"/>',pause:'<path d="M8 5v14M16 5v14"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="1"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',check:'<path d="m5 12 4 4L19 6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',audio:'<path d="M4 9v6m4-9v12m4-15v18m4-15v12m4-9v6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',heart:'<path d="M20 5c-3-3-6-1-8 1-2-2-5-4-8-1-5 5 2 10 8 15 6-5 13-10 8-15Z"/>'};
function icon(n){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.leaf}</svg>`;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const STORE='habita-demo-v1';let storageOK=true;
let state={name:0,done:[],journal:[],drafts:{},story:{origin:'',voice:''}};
try{const raw=localStorage.getItem(STORE);if(raw){const saved=JSON.parse(raw);if(saved&&typeof saved==='object'){state={...state,...saved};state.name=0;state.done=Array.isArray(state.done)?state.done.filter(i=>Number.isInteger(i)&&i>=0&&i<7):[];state.journal=Array.isArray(state.journal)?state.journal:[];state.drafts=state.drafts&&typeof state.drafts==='object'?state.drafts:{};state.story=state.story&&typeof state.story==='object'?state.story:{origin:'',voice:''};}}}catch{storageOK=false;}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));storageOK=true;return true;}catch{storageOK=false;return false;}}
const names=[{name:'Savia',tone:'SABIDURÍA INTERIOR',desc:'Una presencia que acompaña tu crecimiento y tu expresión.',line:'Escúchate. Confía. Expresa.'}];
const meds=[
{title:'Presencia antes de grabar',tag:'VOLVER AL PRESENTE',short:'Una pausa para escuchar tu cuerpo y darle espacio a tu voz.',category:'Presencia',art:0,minutes:3,paragraphs:['Busca una postura cómoda y siente el apoyo de tus pies o de tu cuerpo. Puedes mantener los ojos abiertos y observar un punto del lugar. Permite que la respiración siga su ritmo.','Escucha los sonidos que llegan hasta ti. Si hay aves, agua o silencio, deja que formen parte de este momento. No necesitas sentir algo especial.','Reconoce cómo estás antes de comunicar. Quizás hay entusiasmo, tensión o ganas de hacerlo bien. Puedes nombrarlo sin corregirte. Si aparece la exigencia de hacerlo perfecto, observa esa frase como un pensamiento que está presente.','Pregúntate qué idea sencilla deseas compartir hoy. Deja que aparezca una respuesta breve. Siente de nuevo el apoyo del cuerpo. Cuando decidas terminar, escribe esa idea y elige un primer paso posible.']},
{title:'Encuentro con mi yo superior',tag:'ESCUCHAR MI ESENCIA',short:'Conecta con tu sabiduría interior y la intención de tu mensaje.',category:'Yo superior',art:1,minutes:3,paragraphs:['Toma una postura que te permita estar presente. Respira de manera natural. Si te resulta cercano, imagina una luz suave que representa para ti la presencia de tu yo superior. También puedes permanecer con la sensación de tus manos.','Dentro de este espacio, pregúntate qué valor deseas expresar con tu voz. Tal vez honestidad, cuidado o respeto. Elige el que tenga sentido para ti.','Imagina que te diriges a una persona que puede beneficiarse de tu mensaje. Observa cómo cambia tu intención cuando recuerdas que hay alguien escuchando.','Pregúntate qué necesitas cuidar de esa persona y de ti. Puedes reconocer tus límites y conservar tu propia voz. Vuelve al lugar donde estás. Escribe el valor elegido y una decisión que lo haga visible en tu próximo mensaje.']},
{title:'Visualizar mi vida ideal',tag:'IMAGINAR Y ACTUAR',short:'Encuentra una acción pequeña en la vida que deseas construir.',category:'Visualización',art:2,minutes:3,paragraphs:['Siente el contacto del cuerpo con su apoyo. Imagina, si lo deseas, una escena cotidiana de la vida que quieres construir. En esa escena estás frente a la cámara y tienes una idea preparada. Puedes equivocarte y continuar.','Observa cómo te hablas y qué decides compartir. Tu yo cuántico puede representar aquí, como metáfora espiritual, esa posibilidad personal que estás imaginando.','Acércate a un detalle concreto de esa escena. Quizás organizas tres ideas, miras a la cámara o aceptas una pausa. Elige una acción que puedas realizar hoy.','No necesitas alcanzar una imagen ideal para comenzar. Puedes practicar desde quien eres en este momento. Vuelve a sentir tus pies. Escribe tu acción y decide cuándo ensayarla. La visualización queda vinculada con un paso que depende de ti.']}
,
{"title": "Manifestar con intención", "tag": "ELEGIR Y DAR UN PASO", "short": "Revisa una creencia y transforma tu intención en una acción.", "category": "Manifestación", "art": 3, "minutes": 3, "paragraphs": ["Busca una postura cómoda. Siente el apoyo del cuerpo y deja que la respiración siga su ritmo. Trae una intención que tenga sentido para ti: expresarte, terminar un mensaje o compartir una idea que pueda acompañar a alguien.", "Imagina esa intención en una escena cotidiana. Escucha tu voz con amabilidad. Si aparece una creencia como tengo que hacerlo perfecto, pregúntate si esa frase describe un hecho o una exigencia aprendida.", "Ensaya una respuesta que puedas creer: puedo prepararme y aprender mientras me expreso. En Savia, reprogramar el diálogo interior significa practicar nuevas maneras de responder a los hábitos de pensamiento, sin forzar recuerdos ni controlar el inconsciente.", "Reconoce un obstáculo posible y elige un paso. Puedes formularlo así: si comienzo a compararme, entonces volveré a mi idea principal y grabaré una toma de práctica. Regresa al lugar donde estás. Escribe tu intención y una acción que dependa de ti. La visualización no garantiza resultados externos."]}
];
const practices=[
{title:'Reconocer mi exigencia',desc:'Observa qué te hace repetir una toma y comienza con una presentación privada.',med:0,prompt:'¿Qué creo que tiene que ser perfecto para permitirme comunicar?',task:'Escribe la exigencia que reconoces. Después, graba una presentación privada de treinta segundos con la cámara de tu teléfono.',placeholder:'Cuando voy a grabar, me exijo…'},
{title:'Habitar mi propia voz',desc:'Escucha una toma con curiosidad y reconoce lo que ya puedes aportar.',med:0,prompt:'¿Qué idea valiosa encuentro en mi mensaje?',task:'Escucha tu grabación una vez. Escribe una idea útil y una mejora concreta que no dependa de tu apariencia.',placeholder:'Una idea que vale la pena compartir es…'},
{title:'Escuchar mi yo superior',desc:'Elige los valores desde los que quieres hacerte visible.',med:1,prompt:'¿Qué valor quiero que se sienta cuando alguien me escucha?',task:'Elige dos valores. Escribe a quién deseas acompañar con tu mensaje y una decisión que exprese esos valores.',placeholder:'Quiero comunicar desde… para acompañar a…'},
{title:'Revisar mi diálogo interno',desc:'Cuestiona una exigencia y ensaya una forma más amable de hablarte.',med:0,prompt:'¿Cómo puedo hablarme mientras estoy aprendiendo?',task:'Escribe una exigencia y una alternativa realista. Ensaya una idea breve con permiso para aprender.',placeholder:'La exigencia que aparece es… Puedo recordarme que…'},
{title:'Manifestar con intención',desc:'Revisa una creencia y conecta tu visión con un paso posible hoy.',med:3,prompt:'¿Qué haría hoy esa versión de mí que comunica con confianza?',task:'Imagina una escena cotidiana, elige una acción y ensaya un mensaje de cuarenta y cinco segundos.',placeholder:'En esa escena me veo… Hoy puedo…'},
{title:'Comunicar con coherencia',desc:'Prepara un mensaje claro, verdadero y respetuoso con otras personas.',med:1,prompt:'¿Cómo hago visible mi intención de aportar?',task:'Prepara un mensaje de un minuto. Revisa sus afirmaciones y los permisos de quienes aparecen o son mencionados.',placeholder:'Mi idea principal es… Se la dirijo a…'},
{title:'Elegir qué compartir',desc:'Termina una pieza y decide con libertad cómo quieres compartirla.',med:2,prompt:'¿Qué decisión respeta mi voz y a quienes pueden escucharla?',task:'Completa tu pieza. Puedes guardarla, compartirla en privado o publicarla desde la plataforma que elijas.',placeholder:'Mi mensaje está listo para… La decisión que elijo es…'}
];
state.name=0;
state.manifest=state.manifest||{intention:'',belief:'',action:''};
let route='inicio',filter='Todas',mood='En calma',toastTimer,returnFocus;
const nav=[['inicio','Inicio','home'],['camino','Mi camino','path'],['meditaciones','Meditaciones','leaf'],['diario','Mi diario','book'],['esencia','Esencia','spark']];
$('#navigation').innerHTML=nav.map(([r,t,i])=>`<a href="#${r}" data-route="${r}">${icon(i)}<span>${t}</span></a>`).join('');
function setBrand(){document.querySelectorAll('.brand-name').forEach(el=>el.textContent=names[state.name].name);document.title=names[state.name].name+' · Un espacio para expresarte';}
function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3300);}
function progress(){return `<div class="progress-line" aria-label="${state.done.length} de siete prácticas completadas">${practices.map((_,i)=>`<i class="${state.done.includes(i)?'done':''}"></i>`).join('')}</div><div class="progress-caption">${state.done.length} de 7 prácticas a tu ritmo</div>`;}
function art(id){if(id===0)return '<svg viewBox="0 0 220 150" aria-hidden="true"><g fill="none" stroke="#a28acb" stroke-width="1.1"><ellipse cx="110" cy="81" rx="57" ry="45"/><ellipse cx="110" cy="81" rx="43" ry="34"/><ellipse cx="110" cy="81" rx="28" ry="23"/></g><circle cx="110" cy="81" r="12" fill="#c3b0e2"/></svg>';if(id===3)return '<svg viewBox="0 0 220 150" aria-hidden="true"><g fill="none" stroke="#a57fc5" stroke-width="1.2"><path d="m110 20 12 35 37 12-37 12-12 36-12-36-37-12 37-12Z"/><circle cx="110" cy="67" r="53" opacity=".35"/></g></svg>';if(id===1)return '<svg viewBox="0 0 220 150" aria-hidden="true"><g fill="none" stroke="#bd83ad" stroke-width="1.2"><path d="M110 132V25m0 90c-44-4-52-35-39-48 28-4 38 22 39 48Zm0-17c38-4 45-33 32-44-24-1-32 21-32 44Zm0-27c-27-5-34-27-23-38 20 1 24 18 23 38Z"/></g></svg>';return '<svg viewBox="0 0 220 150" aria-hidden="true"><circle cx="110" cy="67" r="25" fill="#a8bfdc"/><g fill="none" stroke="#859dc5" stroke-width="1.1"><path d="M39 105h142M55 119h110M73 133h74M42 91c29-13 51-13 68 0 19-13 40-13 68 0"/><path d="M110 27V13M145 41l10-9M75 41l-10-9"/></g></svg>';}
function medCard(m,i){return `<button class="med-card" data-med="${i}" aria-label="Abrir meditación ${esc(m.title)}"><div class="med-art art-${m.art}">${art(m.art)}</div><div class="med-body"><span class="label">${m.tag}</span><h3>${m.title}</h3><p>${m.short}</p><div class="med-meta"><span>3 min de pausa · Guía disponible</span><span class="play-circle">${icon('play')}</span></div></div></button>`;}
function home(){const next=practices.findIndex((_,i)=>!state.done.includes(i)),idx=next<0?0:next;return `<section class="hero"><div class="hero-copy"><p class="page-eyebrow">RESPIRA. ESCÚCHATE. COMPARTE.</p><h1>Dale espacio<br>a tu propia voz.</h1><p>Una pausa para conectar con tu esencia y crear desde un lugar más auténtico.</p><button class="button" data-practice="${idx}">Comenzar mi práctica ${icon('arrow')}</button></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 440 350"><defs><linearGradient id="sun" x2="0" y2="1"><stop stop-color="#edb9f3"/><stop offset="1" stop-color="#a6c5f2"/></linearGradient></defs><circle cx="244" cy="151" r="97" fill="url(#sun)" opacity=".55"/><g fill="none" stroke="#8f79b9" stroke-width="1"><ellipse cx="244" cy="151" rx="118" ry="119" opacity=".35"/><ellipse cx="244" cy="151" rx="137" ry="138" opacity=".18"/><path d="M237 321c10-77-5-142-17-204m16 163c-84-8-110-72-87-107 56-2 89 44 87 107Zm3-52c72-2 99-66 74-100-49 1-75 52-74 100Zm-13-45c-53-9-75-58-53-85 39 6 55 46 53 85Z"/></g><path d="M0 331c98-25 140 8 228-9s160-14 212 2" fill="none" stroke="#b7a9d5"/></svg><span class="hero-caption">PRESENCIA QUE FLORECE</span></div></section><section class="home-grid"><div class="card"><span class="label">TU CAMINO PERSONAL</span><div class="practice-summary"><span class="practice-orb">${icon('path')}</span><div><h3>${practices[idx].title}</h3><p>Práctica ${idx+1} · Meditación y un paso concreto</p></div></div>${progress()}<div class="card-bottom"><span class="progress-caption">Puedes volver a cualquier práctica.</span><button class="text-button" data-go="camino">Ver mi camino ↗</button></div></div><div class="card intention-card"><span class="label">UNA PREGUNTA PARA HOY</span><h3>¿Qué quieres que tu voz aporte al mundo?</h3><p>Tu intención puede empezar con una sola frase.</p><button class="text-button" data-go="diario">Escribir en mi diario ↗</button></div></section><section><div class="section-heading"><div><h2>Vuelve a tu centro</h2><p>Meditaciones para acompañar tu expresión.</p></div><button class="text-button" data-go="meditaciones">Ver todas ↗</button></div><div class="med-grid">${meds.slice(0,3).map(medCard).join('')}</div></section><p class="quote">“Mi voz puede tener valor mientras sigo aprendiendo.”</p>`;}
function camino(){return `<div class="route-header"><div><p class="page-eyebrow">UN PASO CADA VEZ</p><h1>Tu camino hacia una voz auténtica</h1><p class="page-intro">Siete prácticas para reconocer el perfeccionismo, escuchar tu sabiduría interior y crear un mensaje con intención.</p></div><span class="count-badge">${state.done.length} de 7 completadas</span></div><div class="path-list">${practices.map((p,i)=>`<article class="path-step ${state.done.includes(i)?'completed':''}"><span class="step-number">${state.done.includes(i)?icon('check'):String(i+1).padStart(2,'0')}</span><div><h3>${p.title}</h3><p>${p.desc}</p></div><button class="button ${state.done.includes(i)?'secondary':'soft'} small" data-practice="${i}">${state.done.includes(i)?'Volver a practicar':'Explorar práctica'} ${icon('arrow')}</button></article>`).join('')}</div><p class="helper-note">El recorrido es flexible. Guardar una grabación en privado también puede ser un avance.</p>`;}
function library(){const list=meds.map((m,i)=>({m,i})).filter(({m})=>filter==='Todas'||m.category===filter);return `<section class="library"><p class="page-eyebrow">REGRESAR A TU ESENCIA</p><h1>Un espacio para escucharte</h1><p class="page-intro">Explora la presencia, tu yo superior y una manifestación consciente vinculada con acciones posibles.</p><div class="library-filters" aria-label="Filtrar meditaciones">${['Todas','Presencia','Yo superior','Visualización','Manifestación'].map(f=>`<button class="chip ${filter===f?'active':''}" data-filter="${f}" aria-pressed="${filter===f}">${f}</button>`).join('')}</div><div class="med-grid">${list.map(({m,i})=>medCard(m,i)).join('')}</div><p class="wide-note">Puedes escuchar una guía con voz sintética de muestra, leer el texto o practicar tres minutos en silencio. En la versión final, las meditaciones podrán llevar la voz de su creadora.</p></section>`;}
function journal(){return `<p class="page-eyebrow">TU ESPACIO INTERIOR</p><h1>Lo que tu voz quiere contarte</h1><p class="page-intro">Un lugar para reconocer lo que sientes y recordar el paso que quieres dar. No necesitas escribir algo perfecto.</p><div class="journal-grid"><form class="card" id="journal-form"><label class="form-label" for="journal-text">¿Qué está presente en ti hoy?</label><textarea id="journal-text" maxlength="6000" placeholder="Hoy me doy cuenta de… Me gustaría permitirme…" required>${esc(state.journalDraft||'')}</textarea><span class="form-label">¿Cómo te sientes?</span><div class="mood-row">${['En calma','Con dudas','Con energía','Con apertura'].map(v=>`<button type="button" class="chip ${mood===v?'active':''}" data-mood="${v}" aria-pressed="${mood===v}">${v}</button>`).join('')}</div><label class="form-label" for="confidence">Mi disposición para expresar mi voz <output id="confidence-value">5</output>/10</label><input type="range" id="confidence" min="0" max="10" value="5"><div class="range-labels"><span>Prefiero pausar</span><span>Me siento dispuesta</span></div><div class="form-actions"><button class="button" type="submit">Guardar reflexión ${icon('check')}</button></div><p class="privacy-hint">Solo en este navegador. En un dispositivo compartido, puedes borrar tus datos al terminar.</p></form><section class="card"><div class="section-heading" style="margin:0 0 18px"><h2>Mis reflexiones</h2><span class="label">${state.journal.length} ${state.journal.length===1?'ENTRADA':'ENTRADAS'}</span></div>${state.journal.length?state.journal.map(e=>`<article class="entry"><div class="entry-date">${esc(e.date)}</div><p>${esc(e.text)}</p><div class="entry-tags"><span>${esc(e.mood)}</span><span>Disposición ${esc(e.confidence)}/10</span></div><button class="entry-remove" data-delete-entry="${esc(e.id)}">Eliminar esta entrada</button></article>`).join(''):`<div class="empty-state">${icon('book')}<h3>Tu historia comienza aquí</h3><p>Las reflexiones que decidas guardar aparecerán en este espacio.</p></div>`}</section></div><div class="journal-tools"><button class="text-button" data-action="export">Descargar mis reflexiones</button><button class="text-button" data-action="privacy">Gestionar y borrar mis datos</button></div>`;}
function naming(){return `<p class="page-eyebrow">EL ESPÍRITU DE SAVIA</p><h1>La sabiduría que te acompaña</h1><p class="page-intro">Savia nace de la vocación de acompañar a otras personas y de la unión entre yoga y comunicación consciente. Su nombre invita a escuchar la sabiduría interior mientras aprendemos a expresarnos.</p><div class="home-grid"><section class="card intention-card"><span class="label">UNA PRESENCIA CERCANA</span><h2 style="margin-top:14px">Acompañar sin imponer</h2><p>Tu camino, tus creencias y tus decisiones merecen respeto. Puedes adaptar una práctica, detenerla o elegir otra forma de participar.</p></section><section class="card"><span class="label">METAGNOSIA Y METANOIA</span><h2 style="margin-top:14px">Reconocer y transformar</h2><p class="page-intro" style="margin:0">Observa qué crees sobre ti, revisa esa interpretación y elige una respuesta posible. El autoconocimiento se convierte en una acción consciente.</p></section></div><section class="card name-story"><p class="page-eyebrow">MANIFESTACIÓN CONSCIENTE</p><h2>Mi intención y mi siguiente paso</h2><p class="page-intro">Visualiza una posibilidad que tenga sentido para ti. Reconoce la creencia que deseas revisar y decide cómo actuar. Esta práctica no promete controlar el inconsciente ni garantizar resultados externos.</p><form id="manifest-form"><label class="form-label" for="manifest-intention">La intención que quiero cultivar</label><input id="manifest-intention" type="text" maxlength="500" placeholder="Quiero compartir una idea con mi voz auténtica…" value="${esc(state.manifest?.intention||'')}"><div class="story-form" style="margin-top:18px"><label for="manifest-belief">Una creencia que elijo revisar<textarea id="manifest-belief" maxlength="2000" placeholder="Me digo que… Puedo ensayar otra respuesta…">${esc(state.manifest?.belief||'')}</textarea></label><label for="manifest-action">Mi plan para dar un paso<textarea id="manifest-action" maxlength="2000" placeholder="Si aparece este obstáculo…, entonces haré…">${esc(state.manifest?.action||'')}</textarea></label></div><div class="form-actions"><button class="button" type="submit">Guardar mi intención</button><button class="button secondary" type="button" data-action="export-manifest">Descargar mi intención</button><button class="button soft" type="button" data-med="3">Abrir meditación</button></div><p class="privacy-hint">Tu intención se guarda solo en este navegador.</p></form></section>`;}
function render(){setBrand();document.querySelectorAll('[data-route]').forEach(a=>{const active=a.dataset.route===route;a.classList.toggle('active',active);active?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');});const pages={inicio:home,camino,meditaciones:library,diario:journal,esencia:naming};main.innerHTML=(!storageOK?'<p class="storage-warning">El navegador no permite guardar cambios. Puedes usar la demo, pero tus datos podrían perderse al cerrar.</p>':'')+(pages[route]||home)();}
function navigate(r){if(!nav.some(x=>x[0]===r))r='inicio';if(!$('#modal').hidden)closeModal();route=r;render();window.scrollTo({top:0,behavior:'instant'});}
window.addEventListener('hashchange',()=>{navigate(location.hash.slice(1));main.focus({preventScroll:true});});
function go(r){if(location.hash==='#'+r){navigate(r);main.focus({preventScroll:true});}else location.hash=r;}
function openModal(content,wide=false){playerStop();returnFocus=document.activeElement;$('#modal').innerHTML=`<section class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><button class="close-modal" data-action="close" aria-label="Cerrar">${icon('close')}</button>${content}</section>`;$('#modal').hidden=false;document.body.style.overflow='hidden';$('.app-shell').inert=true;$('.sidebar').inert=true;setTimeout(()=>$('.close-modal')?.focus(),0);}
function closeModal(){playerStop();$('#modal').hidden=true;$('#modal').innerHTML='';document.body.style.overflow='';$('.app-shell').inert=false;$('.sidebar').inert=false;returnFocus?.isConnected&&returnFocus.focus();}
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal();});
document.addEventListener('keydown',e=>{if($('#modal').hidden)return;if(e.key==='Escape'){e.preventDefault();closeModal();}if(e.key==='Tab'){const els=[...$('#modal').querySelectorAll('button,input,select,textarea,a[href],summary')].filter(el=>!el.disabled&&el.offsetParent!==null);const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
let currentMed=0,timer=null,remaining=180,mode='idle',utterance=null,speechIndex=0,speechToken=0,ambientCtx=null,ambientNodes=[],ambientInterval=null;
function playerStop(){speechToken++;if('speechSynthesis'in window)window.speechSynthesis.cancel();clearInterval(timer);timer=null;mode='idle';utterance=null;stopAmbient();}
function playerUI(status){const listen=$('#listen'),orb=$('.breath-orb'),silent=$('#silent');if(!listen)return;listen.innerHTML=icon(mode==='speech'?'pause':'play')+(mode==='speech'?'Pausar guía':mode==='speechPaused'?'Continuar guía':'Escuchar guía');silent.innerHTML=mode==='timer'?'Pausar silencio':mode==='timerPaused'?'Continuar silencio':'Practicar en silencio';orb?.classList.toggle('running',mode==='speech'||mode==='timer');if(status)$('#player-status').textContent=status;}
function showMed(i){currentMed=i;remaining=180;speechIndex=0;const m=meds[i];openModal(`<p class="page-eyebrow">${m.tag}</p><h2 id="dialog-title">${m.title}</h2><p class="subtitle">${m.short} Puedes detenerte o mantener los ojos abiertos.</p><div class="player-visual"><span class="player-time" id="player-time">03:00</span><span class="breath-orb"></span><p class="player-hint">Respira de forma natural, a tu propio ritmo.</p></div><div class="player-controls"><button class="button" id="listen" data-action="listen">${icon('play')}Escuchar guía</button><button class="button secondary" id="silent" data-action="silent">Practicar en silencio</button><button class="button secondary" data-action="stop-audio" aria-label="Detener y reiniciar">${icon('stop')}</button></div><div class="player-status" id="player-status" role="status" aria-live="polite">Elige cómo quieres acompañar esta pausa.</div><p class="audio-note">La guía usa una voz sintética de muestra del navegador. La duración de lectura varía. El temporizador silencioso dura tres minutos. Las pausas finales podrán grabarse con tu voz.</p><div class="ambient-row"><label for="ambient">Sonido de fondo</label><select id="ambient"><option value="none">Sin sonido</option><option value="water">Agua suave</option><option value="birds">Aves suaves</option></select><label for="volume">Volumen</label><input id="volume" type="range" min="0" max="100" value="35" aria-label="Volumen del sonido de fondo"></div><p class="privacy-hint">Agua y aves son sonidos sintetizados para esta demo. Solo comienzan cuando los eliges.</p><details class="transcript"><summary>Leer la meditación completa</summary>${m.paragraphs.map(t=>`<p>${esc(t)}</p>`).join('')}</details><div class="form-actions"><button class="button soft" data-action="med-to-path">Continuar con mi práctica ${icon('arrow')}</button></div>`);}
function startSpeech(){if(mode==='speech'){window.speechSynthesis.pause();mode='speechPaused';playerUI('Guía en pausa.');return;}if(mode==='speechPaused'){window.speechSynthesis.resume();mode='speech';playerUI('Escuchando la guía.');return;}clearInterval(timer);timer=null;if(!('speechSynthesis'in window)||!window.speechSynthesis.getVoices().some(v=>v.lang.toLowerCase().startsWith('es'))){mode='idle';playerUI('No hay una voz en español disponible. Puedes leer la guía o practicar en silencio.');$('.transcript').open=true;return;}window.speechSynthesis.cancel();mode='speech';speechIndex=0;const token=++speechToken;function next(){if(token!==speechToken||mode==='idle')return;const text=meds[currentMed].paragraphs[speechIndex];if(!text){mode='idle';stopAmbient();playerUI('La guía ha terminado. Toma el tiempo que necesites.');return;}utterance=new SpeechSynthesisUtterance(text);utterance.lang='es-ES';utterance.voice=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('es'));utterance.rate=.82;utterance.onend=()=>{speechIndex++;setTimeout(next,1600);};utterance.onerror=()=>{if(token===speechToken){mode='idle';stopAmbient();playerUI('La voz no pudo reproducirse. Puedes leer la guía o practicar en silencio.');$('.transcript').open=true;}};window.speechSynthesis.speak(utterance);}next();playerUI('Escuchando la guía. Puedes pausar cuando quieras.');}
function silent(){if(mode==='timer'){clearInterval(timer);timer=null;mode='timerPaused';playerUI('Temporizador en pausa.');return;}if(mode!=='timerPaused'){speechToken++;if('speechSynthesis'in window)window.speechSynthesis.cancel();remaining=180;}mode='timer';playerUI('Una pausa en silencio, a tu ritmo.');clearInterval(timer);timer=setInterval(()=>{remaining--;const el=$('#player-time');if(el)el.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(remaining<=0){clearInterval(timer);timer=null;mode='idle';stopAmbient();playerUI('La pausa ha terminado. Regresa cuando lo sientas.');}},1000);}
function stopAmbient(){clearInterval(ambientInterval);ambientInterval=null;for(const n of ambientNodes){try{n.stop();}catch{}try{n.disconnect();}catch{}}ambientNodes=[];if(ambientCtx){ambientCtx.close().catch(()=>{});ambientCtx=null;}}
async function ambience(){stopAmbient();const choice=$('#ambient')?.value;if(!choice||choice==='none')return;const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){toast('Este navegador no permite el ambiente sonoro.');return;}try{ambientCtx=new Audio();await ambientCtx.resume();const ctx=ambientCtx;const gain=ctx.createGain();gain.gain.value=Number($('#volume').value)/100*.11;gain.connect(ctx.destination);ctx.demoGain=gain;if(choice==='water'){const buf=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate);const data=buf.getChannelData(0);let last=0;for(let i=0;i<data.length;i++){last=(last+.02*(Math.random()*2-1))/1.02;data[i]=last*8;}const noise=ctx.createBufferSource();noise.buffer=buf;noise.loop=true;const low=ctx.createBiquadFilter();low.type='lowpass';low.frequency.value=850;noise.connect(low);low.connect(gain);noise.start();ambientNodes.push(noise);}else{const chirp=()=>{if(!ambientCtx)return;const t=ctx.currentTime;for(let i=0;i<2;i++){const osc=ctx.createOscillator(),env=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(1700+Math.random()*400,t+i*.2);osc.frequency.exponentialRampToValueAtTime(3200,t+i*.2+.08);osc.frequency.exponentialRampToValueAtTime(2200,t+i*.2+.17);env.gain.setValueAtTime(0,t+i*.2);env.gain.linearRampToValueAtTime(.4,t+i*.2+.03);env.gain.exponentialRampToValueAtTime(.001,t+i*.2+.2);osc.connect(env);env.connect(gain);osc.start(t+i*.2);osc.stop(t+i*.2+.22);osc.onended=()=>{osc.disconnect();env.disconnect();ambientNodes=ambientNodes.filter(n=>n!==osc);};ambientNodes.push(osc);}};chirp();ambientInterval=setInterval(chirp,3200);}}catch{stopAmbient();toast('No se pudo iniciar el sonido. Puedes continuar en silencio.');}}
function showPractice(i){const p=practices[i];openModal(`<p class="page-eyebrow">PRÁCTICA ${i+1} DE 7</p><h2 id="dialog-title">${p.title}</h2><p class="subtitle">${p.desc}</p><div class="practice-detail"><section class="practice-prompt"><span class="label">UNA PAUSA PARA MIRAR ADENTRO</span><h3 style="margin-top:13px">${p.prompt}</h3><button class="button secondary small" data-med="${p.med}">${icon('audio')}Abrir meditación</button></section><section class="exercise-body"><span class="label">TU ACCIÓN DE HOY</span><p style="margin-top:13px">${p.task}</p><p>Si decides grabar, utiliza tu cámara habitual. Tus archivos permanecen contigo.</p></section></div><label class="form-label" for="practice-draft">Mi reflexión o borrador privado</label><textarea id="practice-draft" data-draft="${i}" maxlength="6000" placeholder="${p.placeholder}">${esc(state.drafts[i]||'')}</textarea>${i>=5?`<ul class="review-list"><li><label><input type="checkbox">Mi idea se entiende y representa lo que quiero decir.</label></li><li><label><input type="checkbox">Revisé mis afirmaciones y el consentimiento de otras personas.</label></li><li><label><input type="checkbox">Elegí cómo compartirla respetando mis límites.</label></li></ul>`:''}<div class="practice-done"><button class="button" data-complete="${i}">${icon('check')}${state.done.includes(i)?'Guardar y cerrar':'He realizado esta práctica'}</button><button class="button secondary" data-action="save-draft">Guardar borrador</button></div><p class="privacy-hint">Tu borrador se guarda en este navegador. Completar la práctica es una decisión personal y no implica publicar.</p>`,true);}
function privacy(){openModal(`<p class="page-eyebrow">UN ESPACIO QUE CUIDAS TÚ</p><h2 id="dialog-title">Tu privacidad</h2><div class="dialog-prose"><p>Tus reflexiones, borradores, progreso, intenciones personales se guardan en este navegador. Esta demo no solicita cuentas ni sube tus grabaciones.</p><p>En un dispositivo compartido, otras personas que usen el mismo navegador podrían ver este contenido. Borrar los datos del navegador también elimina tu progreso.</p><p>Puedes descargar tus reflexiones y después borrar todos los datos de esta demo. La eliminación no afecta a los archivos que ya hayas descargado.</p></div><div class="form-actions"><button class="button secondary" data-action="export">${icon('download')}Descargar reflexiones</button></div><div class="danger-area"><h3>Borrar mis datos</h3><p>Se eliminarán el diario, los borradores, las intenciones y las prácticas completadas de este navegador.</p><button class="button danger" data-action="confirm-delete">Revisar eliminación</button></div>`);}
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)return go(b.dataset.go);if(b.dataset.med!==undefined)return showMed(Number(b.dataset.med));if(b.dataset.practice!==undefined)return showPractice(Number(b.dataset.practice));if(b.dataset.filter){filter=b.dataset.filter;render();return;}if(b.dataset.name!==undefined){state.name=Number(b.dataset.name);save();render();toast('Así se siente '+names[state.name].name+'. Puedes seguir explorando.');return;}if(b.dataset.mood){mood=b.dataset.mood;document.querySelectorAll('[data-mood]').forEach(x=>{const active=x.dataset.mood===mood;x.classList.toggle('active',active);x.setAttribute('aria-pressed',active);});return;}if(b.dataset.complete!==undefined){const i=Number(b.dataset.complete);state.drafts[i]=$('#practice-draft').value;if(!state.done.includes(i))state.done.push(i);const ok=save();closeModal();render();toast(ok?'Práctica guardada. Gracias por darte este espacio.':'La práctica está completa en esta sesión. No se pudo guardar.');return;}if(b.dataset.deleteEntry){const id=b.dataset.deleteEntry;openModal(`<p class="page-eyebrow">CUIDAR MI ESPACIO</p><h2 id="dialog-title">¿Eliminar esta reflexión?</h2><p class="subtitle">Esta entrada se borrará de este navegador y no podrás recuperarla desde la demo.</p><div class="form-actions"><button class="button danger" data-remove-confirm="${esc(id)}">Eliminar entrada</button><button class="button secondary" data-action="close">Conservarla</button></div>`);return;}if(b.dataset.removeConfirm){state.journal=state.journal.filter(x=>x.id!==b.dataset.removeConfirm);save();closeModal();render();toast('Reflexión eliminada.');return;}switch(b.dataset.action){case'close':closeModal();break;case'about':openModal(`<p class="page-eyebrow">DESARROLLO INTEGRAL HUMANO</p><h2 id="dialog-title">Presencia para expresarte</h2><div class="dialog-prose"><p>Savia une yoga, meditación, manifestación consciente y comunicación para explorar el perfeccionismo al crear contenido. Nace de la vocación de acompañar.</p><p>El yo superior, la energía y la visualización forman parte de su lenguaje espiritual. El yo cuántico se utiliza como metáfora personal de posibilidades, sin presentarlo como una explicación de física.</p><p>Las prácticas son educativas y de bienestar. Puedes detenerlas, leerlas o saltarlas. No sustituyen atención profesional ni prometen curación.</p><p>El recorrido, el diario y el registro de intenciones funcionan como muestra de la experiencia. Los textos son originales y la voz disponible es sintética.</p></div><button class="button soft" data-go="esencia">Conocer la esencia de Savia ${icon('arrow')}</button>`);break;case'privacy':privacy();break;case'listen':startSpeech();break;case'silent':silent();break;case'stop-audio':playerStop();remaining=180;$('#player-time').textContent='03:00';playerUI('La pausa está detenida. Puedes volver a comenzar.');break;case'med-to-path':closeModal();go('camino');break;case'save-draft':{const el=$('#practice-draft');state.drafts[el.dataset.draft]=el.value;toast(save()?'Borrador guardado en este navegador.':'No se pudo guardar. Copia tu texto antes de salir.');break;}case'export':if(!state.journal.length){toast('Aún no hay reflexiones para descargar.');break;}download(names[state.name].name+'\nMIS REFLEXIONES\n\n'+state.journal.map(x=>`${x.date}\n${x.mood} · Disposición ${x.confidence}/10\n\n${x.text}`).join('\n\n---\n\n'),'mis_reflexiones.txt');toast('Descarga preparada.');break;case'export-manifest':download('SAVIA\nMI INTENCIÓN CONSCIENTE\n\n'+(state.manifest?.intention||'')+'\n\nCREENCIA QUE REVISO\n'+(state.manifest?.belief||'')+'\n\nMI SIGUIENTE PASO\n'+(state.manifest?.action||''),'Savia_Mi_Intencion.txt');break;case'export-story':download(`NOMBRE EN EXPLORACIÓN\n${names[state.name].name}\n\nQUÉ ME LLEVÓ AL YOGA\n${$('#story-origin')?.value||state.story.origin||''}\n\nMI MANERA DE ACOMPAÑAR\n${$('#story-voice')?.value||state.story.voice||''}`,'mi_historia_y_el_nombre.txt');break;case'confirm-delete':openModal(`<p class="page-eyebrow">DATOS DE ESTA DEMO</p><h2 id="dialog-title">¿Borrar todo mi registro?</h2><p class="subtitle">Se eliminarán tus reflexiones, borradores, progreso e intenciones de este navegador. Puedes conservarlos descargándolos antes.</p><div class="form-actions"><button class="button danger" data-action="erase">Sí, borrar mis datos</button><button class="button secondary" data-action="close">Conservar mis datos</button></div>`);break;case'erase':try{localStorage.removeItem(STORE);state={name:0,done:[],journal:[],drafts:{},story:{origin:'',voice:''},manifest:{intention:'',belief:'',action:''}};closeModal();render();toast('Los datos de esta demo se han borrado.');}catch{toast('El navegador no permitió borrar los datos.');}break;}});
document.addEventListener('input',e=>{if(e.target.id==='confidence')$('#confidence-value').textContent=e.target.value;if(e.target.id==='journal-text'){state.journalDraft=e.target.value;save();}if(e.target.dataset.draft!==undefined){state.drafts[e.target.dataset.draft]=e.target.value;save();}if(e.target.id==='volume'&&ambientCtx?.demoGain)ambientCtx.demoGain.gain.value=Number(e.target.value)/100*.11;if(e.target.id==='story-origin'){state.story.origin=e.target.value;save();}if(e.target.id==='story-voice'){state.story.voice=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.id==='ambient')ambience();});
document.addEventListener('submit',e=>{if(e.target.id==='manifest-form'){e.preventDefault();state.manifest={intention:$('#manifest-intention').value,belief:$('#manifest-belief').value,action:$('#manifest-action').value};toast(save()?'Tu intención y tu siguiente paso están guardados.':'No se pudo guardar. Copia tu intención antes de salir.');}if(e.target.id==='journal-form'){e.preventDefault();const text=$('#journal-text').value.trim();if(!text){toast('Escribe una frase para guardar tu reflexión.');return;}state.journal.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),text,mood,confidence:Number($('#confidence').value),date:new Intl.DateTimeFormat('es-VE',{dateStyle:'long',timeStyle:'short',timeZone:'America/Caracas'}).format(new Date())});state.journalDraft='';const ok=save();render();toast(ok?'Tu reflexión está guardada.':'No se pudo guardar. Descarga tus reflexiones antes de salir.');}if(e.target.id==='story-form'){e.preventDefault();state.story={origin:$('#story-origin').value,voice:$('#story-voice').value};toast(save()?'Tu historia quedó guardada aquí. Puedes descargarla para compartirla.':'No se pudo guardar. Descarga tu historia antes de salir.');}});
window.addEventListener('pagehide',()=>playerStop());
navigate(location.hash.slice(1)||'inicio');
</script>
